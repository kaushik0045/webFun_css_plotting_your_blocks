# Render "Blueprint": tells Render how to run the app. See DEPLOY section in README.md.
services:
  - type: web
    name: jrp-client-book
    runtime: node
    rootDir: jrp-app
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
    disk:
      name: jrp-data
      mountPath: /var/data
      sizeGB: 5
